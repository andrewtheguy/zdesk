name: Rust format

# Every crate's code as rustfmt.toml has it: the workspace, and the two wasm
# modules outside it, checked with stable's rustfmt whatever toolchain a
# module pins.
on:
  push:
    paths:
      - "**.rs"
      - rustfmt.toml
      - .github/workflows/rust-format.yml
  pull_request:
    paths:
      - "**.rs"
      - rustfmt.toml
      - .github/workflows/rust-format.yml

jobs:
  rustfmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install rustfmt
        run: rustup toolchain install stable --profile minimal --component rustfmt

      - name: Check formatting
        run: |
          cargo +stable fmt --all --check
          cargo +stable fmt --manifest-path frontend/wasm/egfx/Cargo.toml --check
          cargo +stable fmt --manifest-path frontend/wasm/apple-adaptive/Cargo.toml --check
